<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>黄志恒·作品集</title>
    <style>
        /* ---------- 极简重置 ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            background: #ffffff;
            color: #1a1a1a;
            line-height: 1.7;
            padding: 2.5rem 1.5rem;
        }

        .container {
            max-width: 720px;
            margin: 0 auto;
        }

        /* ---------- 头部 ---------- */
        .header {
            margin-bottom: 3rem;
            border-bottom: 1px solid #e5e5e5;
            padding-bottom: 1.5rem;
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        .header .sub {
            color: #555;
            font-size: 1rem;
            margin-top: 0.1rem;
        }

        /* ---------- 通用标题 ---------- */
        .section-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin: 2.5rem 0 0.8rem 0;
            letter-spacing: 0.3px;
            color: #222;
        }

        /* ---------- 项目列表 ---------- */
        .project-item {
            padding: 0.6rem 0 0.8rem 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .project-item:last-child {
            border-bottom: none;
        }

        .project-item .name {
            font-weight: 500;
            font-size: 1rem;
        }

        .project-item .desc {
            color: #444;
            font-size: 0.9rem;
            margin: 0.1rem 0 0.3rem 0;
        }

        .project-item .links a {
            color: #0066cc;
            text-decoration: none;
            font-size: 0.85rem;
            margin-right: 1.2rem;
            border-bottom: 1px solid transparent;
        }

        .project-item .links a:hover {
            border-bottom-color: #0066cc;
        }

        /* ---------- 关于 / 联系 ---------- */
        .about-text {
            color: #333;
            font-size: 0.95rem;
            margin: 0.2rem 0 0.5rem 0;
        }

        .contact a {
            color: #0066cc;
            text-decoration: none;
            border-bottom: 1px solid #d0d0d0;
        }

        .contact a:hover {
            border-bottom-color: #0066cc;
        }

        /* ---------- 页脚 ---------- */
        .footer {
            margin-top: 3.5rem;
            padding-top: 1.2rem;
            border-top: 1px solid #e5e5e5;
            font-size: 0.8rem;
            color: #888;
            text-align: center;
        }

        /* 响应式 */
        @media (max-width: 500px) {
            body { padding: 1.8rem 1rem; }
            .header h1 { font-size: 1.6rem; }
        }
    </style>
</head>
<body>
<div class="container">

    <!-- ====== 头部 ====== -->
    <div class="header">
        <h1>黄志恒</h1>
        <div class="sub">作品展示</div>
    </div>

    <!-- ====== 项目列表 ====== -->
    <div class="section-title">项目</div>

    <div class="project-item">
        <div class="name">基于YOLO目标检测的工人出入产线警报系统</div>
        <div class="desc">通过YOLO算法和IoU判定实现工人误入产线区域的实时警报。</div>
        <div class="links">
            <a href="projectA.html">预览</a>
            <a href="codeA.html">源码</a>
        </div>
    </div>

    <div class="project-item">
        <div class="name">项目 B</div>
        <div class="desc">一个工具型应用，帮助用户快速完成某类任务。</div>
        <div class="links">
            <a href="#">预览</a>
            <a href="#">源码</a>
        </div>
    </div>

    <div class="project-item">
        <div class="name">项目 C</div>
        <div class="desc">个人博客 / 技术笔记，记录学习与思考。</div>
        <div class="links">
            <a href="#">预览</a>
            <a href="#">源码</a>
        </div>
    </div>

    <!-- ====== 关于 ====== -->
    <div class="section-title">关于</div>
    <div class="about-text">
        我是一名开发者，专注于 Web 应用与工具开发。相信简洁、实用的设计能带来更好的体验。
        目前主要使用 JavaScript / Python 等技术栈。
    </div>

    <!-- ====== 联系 ====== -->
    <div class="section-title">联系</div>
    <div class="contact">
        <a href="https://github.com/Reettee/Reettee.github.io">GitHub</a>
    </div>

    <!-- ====== 页脚 ====== -->
    <div class="footer">
        © 2026 你的名字
    </div>

</div>
</body>
</html>
